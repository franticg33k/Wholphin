# Fork-only workflow (not in upstream Wholphin): builds the cable-tv branch and PRs into it, runs the Cable TV mode
# tests, and uploads debug and release APKs so they can be downloaded from the run's summary page.
# Release APKs are signed with the repository's KEY_ALIAS / KEY_PASSWORD / KEY_STORE_PASSWORD / SIGNING_KEY secrets
# (the same ones upstream's release workflow uses) when they are set, otherwise with a throwaway debug key: those
# install fine but can't update each other, so set the secrets for a stable signature.
# Every push to cable-tv also replaces the "cable-tv-latest" GitHub release with the new release APKs, and a
# manual run can publish a permanent release under a tag of your choice.
name: Cable TV build

on:
  push:
    branches:
      - cable-tv
  pull_request:
    branches:
      - cable-tv
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Also publish a permanent release with this tag (e.g. cable-tv-1.0, not v*, which upstream uses); leave empty for none"
        required: false
        default: ""

defaults:
  run:
    shell: bash

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx12g -XX:MaxMetaspaceSize=1024m'"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch upstream's version tags
        # The app's version comes from `git describe --match=v*`; the fork doesn't carry upstream's tags.
        run: git fetch --no-recurse-submodules --tags https://github.com/damontecres/Wholphin.git || true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build and test
        run: ./gradlew :tvmode-core:test assembleDefaultDebug --no-daemon
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wholphin-cable-tv-debug-${{ github.run_number }}
          path: app/build/outputs/apk/default/debug/*.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fetch upstream's version tags
        # The app's version comes from `git describe --match=v*`; the fork doesn't carry upstream's tags.
        run: git fetch --no-recurse-submodules --tags https://github.com/damontecres/Wholphin.git || true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build release
        env:
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
          KEY_STORE_PASSWORD: "${{ secrets.KEY_STORE_PASSWORD }}"
          SIGNING_KEY: "${{ secrets.SIGNING_KEY }}"
        run: ./gradlew assembleDefaultRelease --no-daemon
      - name: Sign with a debug key when no signing secrets are set
        run: |
          apksigner="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          for apk in app/build/outputs/apk/default/release/*.apk; do
            if "$apksigner" verify "$apk" >/dev/null 2>&1; then
              continue
            fi
            if [ ! -f debug.keystore ]; then
              echo "::warning::No signing secrets set; release APKs are signed with a throwaway debug key"
              echo "DEBUG_SIGNED=true" >> "$GITHUB_ENV"
              keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey \
                -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            "$apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
          done
      - name: Verify signatures
        run: |
          for apk in app/build/outputs/apk/default/release/*.apk; do
            "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs "$apk"
          done
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wholphin-cable-tv-release-${{ github.run_number }}
          path: app/build/outputs/apk/default/release/*.apk
          retention-days: 30
      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: wholphin-cable-tv-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/defaultRelease/mapping.txt
          retention-days: 30
      - name: Name the APKs for the release
        if: github.ref == 'refs/heads/cable-tv' && github.event_name != 'pull_request'
        run: |
          # Asset names and the release title follow what the app's update checker looks for:
          # Wholphin-release-<abi>.apk or Wholphin.apk, and a title that is exactly the version name.
          mkdir -p release-apks
          for apk in app/build/outputs/apk/default/release/*.apk; do
            # Wholphin-default-release-1.0.8-19-g9cceb319-59-arm64-v8a.apk => Wholphin-release-arm64-v8a.apk
            abi=$(basename "$apk" .apk | sed -nE 's/.*-[0-9]+-(armeabi-v7a|arm64-v8a|x86_64)$/\1/p')
            if [ -n "$abi" ]; then
              cp "$apk" "release-apks/Wholphin-release-$abi.apk"
            else
              cp "$apk" "release-apks/Wholphin.apk"
            fi
          done
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          version=$(git describe --tags --long --match='v*' 2>/dev/null || echo v0.0.0)
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "Wholphin with Cable TV mode, built from \`cable-tv\` at ${GITHUB_SHA::7}."
            echo
            echo "- **Wholphin.apk**: universal, works on any device."
            echo "- **Wholphin-release-arm64-v8a.apk**: most Android TV boxes, Google TV and Shield."
            echo "- **Wholphin-release-armeabi-v7a.apk**: older 32-bit devices (many Fire TV sticks)."
            echo "- **Wholphin-release-x86_64.apk**: emulators."
            echo
            echo "Installs as **Wholphin Cable TV**, next to the regular Wholphin app. It checks this repository for updates."
            if [ "${DEBUG_SIGNED:-}" = "true" ]; then
              echo
              echo "Signed with a throwaway key because the repository has no signing secrets: uninstall the previous build before installing this one."
            fi
          } > release-notes.md
      - name: Publish the cable-tv-latest release
        if: github.ref == 'refs/heads/cable-tv' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete cable-tv-latest --cleanup-tag --yes || true
          gh release create cable-tv-latest release-apks/* --target "$GITHUB_SHA" --latest \
            --title "$APP_VERSION" --notes-file release-notes.md
      - name: Publish a permanent release
        if: github.ref == 'refs/heads/cable-tv' && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" release-apks/* --target "$GITHUB_SHA" --latest=false \
            --title "Cable TV $RELEASE_TAG" --notes-file release-notes.md
